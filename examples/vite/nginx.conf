server {
  listen 80;
  root /usr/share/nginx/html;

  # Written when the container starts - never cached, so a new value shows on the next load.
  location = /config.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
  }

  # Built files carry a hash in their names: safe to cache for good.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Any other path is a page of the app.
  location / {
    try_files $uri /index.html;
  }
}
